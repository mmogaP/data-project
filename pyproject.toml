[project]
name = "dataplatform"
version = "0.1.0"
description = "Multi-client data platform: config-driven ingestion, dbt per client, Dagster orchestration"
authors = [
    { name = "Mauricio Moraga", email = "mmoraga.m3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.22",
    "dagster-dbt>=0.29.22",
    "dagster-webserver>=1.13.22",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
module_name = "dataplatform.orchestration.definitions"
