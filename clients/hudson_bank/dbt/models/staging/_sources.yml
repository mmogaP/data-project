version: 2

sources:
  - name: raw
    description: Raw partitions written by the ingestion layer (one Parquet file per day).
    config:
      # Resolved by dbt-duckdb; {name} is the table name below.
      external_location: >-
        read_parquet('{{ env_var('RAW_ROOT', '../../../data/raw') }}/hudson_bank/{name}/ds=*/data.parquet',
        hive_partitioning = true)
      freshness:
        warn_after: { count: 36, period: hour }
        error_after: { count: 48, period: hour }
      loaded_at_field: _ingested_at
    tables:
      - name: cfpb_complaints
        description: CFPB consumer complaints, all companies, partitioned by date received.
        columns:
          - name: complaint_id
            data_tests: [not_null]
